# Docker Compose for Instance 2: Submission Workers, Prometheus
version: '3.8'

services:
  # Submission Workers (10 instances)
  submission-worker-1:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.submission
    container_name: submission-worker-1
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:29092}
      - REDIS_HOST=${REDIS_HOST:-redis:6379}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - CAPSOLVER_API_KEY=${CAPSOLVER_API_KEY}
      - PROXY_API_KEY=${PROXY_API_KEY}
    volumes:
      - ../../config:/root/config
    restart: unless-stopped

